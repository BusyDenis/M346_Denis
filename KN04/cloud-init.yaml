# Kennzeichnung, dass es sich um eine Cloud-Init-Konfigurationsdatei handelt
#cloud-config

# Beginn der Benutzerkonfiguration (Liste von Benutzern, die angelegt/konfiguriert werden)
users:
  # Definition eines neuen Benutzers mit dem Namen "ubuntu"
  - name: ubuntu
    # Zugehörigkeit dieses Benutzers zu den Gruppen "users" und "admin"
    groups: [users, admin]
    # Standardshell, die für diesen Benutzer verwendet wird
    shell: /bin/bash
    # Sudo-Rechte: Benutzer darf alle Befehle ohne Passwortabfrage ausführen
    sudo: ALL=(ALL) NOPASSWD:ALL
    # Abschnitt für die hinterlegten SSH-Public-Keys dieses Benutzers
    ssh_authorized_keys:
      # Öffentlicher SSH-Key, mit dem eine passwortlose Anmeldung erlaubt wird
      - ssh-rsa  denis

# Deaktiviert die Passwort-Authentifizierung für SSH (nur SSH-Key-Login erlaubt)
ssh_pwauth: false

# Root-Benutzer wird NICHT deaktiviert (Root-Account bleibt grundsätzlich nutzbar)
disable_root: false

# Vor der Paketinstallation soll ein Paketlisten-Update (z.B. "apt-get update") durchgeführt werden
package_update: true

# Liste der Pakete, die automatisch installiert werden sollen
packages:
  # Installation des Tools "curl" für HTTP-Anfragen von der Kommandozeile
  - curl
  # Installation des Tools "wget" zum Herunterladen von Dateien über HTTP/HTTPS/FTP
  - wget
